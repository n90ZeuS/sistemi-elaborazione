name: Pubblica sito

# Ogni notte ricostruisce il sito: il materiale compare 7 giorni prima
# della lezione (vedi calendario.json e pianifica.py). I file delle
# lezioni non ancora pubblicate vengono rimossi dalla copia pubblicata.
# Per il materiale pubblicato vengono generati i PDF (genera_pdf.mjs).

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"   # 05:30 ora italiana (04:30 in inverno)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4

      - name: Copia del sito
        run: |
          rsync -a --exclude .git --exclude .github --exclude '*.pptx' ./ _site/
          touch _site/.nojekyll

      - name: Pianificazione e potatura
        working-directory: _site
        run: |
          python3 pianifica.py --pota
          rm -f pianifica.py converti_materiali.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PDF di slide e dispense
        working-directory: _site
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          npm install --no-save --no-package-lock --silent puppeteer-core
          node genera_pdf.mjs
          rm -rf genera_pdf.mjs node_modules

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
