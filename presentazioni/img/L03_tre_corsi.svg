<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="600" height="470" fill="#fff"/>
  <g fill-opacity="0.25" stroke-width="2.5">
    <circle cx="215" cy="165" r="130" fill="#2563eb" stroke="#2563eb"/>
    <circle cx="385" cy="165" r="130" fill="#d97706" stroke="#d97706"/>
    <circle cx="300" cy="295" r="130" fill="#475569" stroke="#475569"/>
  </g>
  <g font-size="18" font-weight="700">
    <text x="40" y="26" fill="#1d4ed8">s = statistica</text>
    <text x="440" y="26" fill="#b45309">a = analisi</text>
    <text x="300" y="455" fill="#334155" text-anchor="middle">i = informatica</text>
  </g>
  <g font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#0f172a" text-anchor="middle">
    <text x="160" y="140">s - a - i</text>
    <text x="440" y="140">a - s - i</text>
    <text x="300" y="380">i - s - a</text>
    <text x="300" y="100">s &amp; a</text><text x="300" y="118">- i</text>
    <text x="228" y="262">s &amp; i</text><text x="228" y="280">- a</text>
    <text x="372" y="262">a &amp; i</text><text x="372" y="280">- s</text>
    <text x="300" y="220" font-weight="700">s &amp; a &amp; i</text>
  </g>
</svg>
